name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >= 3.10, so check the floor as well as
        # a current version rather than taking the claim on trust.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Tests pass from the package directory too
        # The suite used to depend on the working directory: fixtures were bare
        # relative paths, so it passed from here and failed from the repo root.
        # Running it from both places keeps that from coming back.
        working-directory: drawio_c4_lint
        run: python -m pytest -q

      - name: Lint a clean diagram from the command line
        run: |
          python -m drawio_c4_lint drawio_c4_lint/test_files/c4.drawio
