[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drawio-c4-lint"
version = "0.2.0"
description = "Lint C4 diagrams drawn in draw.io"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "lxml>=4.9",
    "pandas>=2.0",
]

[project.optional-dependencies]
analysis = ["networkx>=3.0", "matplotlib>=3.7"]

[project.scripts]
c4lint = "drawio_c4_lint.cli:main"

[tool.setuptools]
packages = ["drawio_c4_lint", "drawio_c4_lint.drawio"]
